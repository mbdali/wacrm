# nginx in front of the stack (BEHIND_PROXY=true). Replace
# crm.example.com and 8090 (= HTTP_PORT in .env.stack), copy to
# /etc/nginx/sites-available/, enable, then add TLS with:
#   certbot --nginx -d crm.example.com

map $http_upgrade $raqmichats_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    # Matches Supabase storage FILE_SIZE_LIMIT (50 MB).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Realtime uses WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $raqmichats_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived realtime sockets and streamed AI responses.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
